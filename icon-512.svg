<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sphereGrad512" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="15%" stop-color="#1e293b" />
      <stop offset="55%" stop-color="#090b10" />
      <stop offset="90%" stop-color="#000000" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <radialGradient id="innerCircle512" cx="38%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>
    <linearGradient id="glowRing512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background Dark Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="#030712" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#glowRing512)" stroke-width="8" filter="drop-shadow(0 0 24px #3b82f6)" />

  <!-- 3D Outer Sphere -->
  <circle cx="256" cy="256" r="204" fill="url(#sphereGrad512)" />

  <!-- Top-left Specular Gloss -->
  <ellipse cx="180" cy="140" rx="76" ry="42" transform="rotate(-28 180 140)" fill="rgba(255,255,255,0.22)" />

  <!-- White Center Badge -->
  <circle cx="256" cy="256" r="102" fill="url(#innerCircle512)" />

  <!-- Number 8 -->
  <text x="256" y="302" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="140" text-anchor="middle" fill="#090b10" letter-spacing="-6">8</text>
</svg>
